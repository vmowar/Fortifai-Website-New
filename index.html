  <!-- ================= FOOTER & ADMIN CUSTOMIZATION TOOLBAR ================= -->
  <footer class="relative z-20 w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
    <div class="text-[12.5px] text-[#64748B]">
      Need immediate assistance or an executive demo during our upgrade?
      <a href="https://bookings.cloud.microsoft/book/FortifaiDemo@fortifai.io/?ismsaljsauthenabled" target="_blank" rel="noopener" class="text-[#99AFBC] hover:text-white underline underline-offset-4 transition-colors ml-1 font-medium">
        Schedule a Call →
      </a>
    </div>

    <!-- Admin Studio Switcher (Hidden automatically when exported for production) -->
    
  </footer>

  <!-- ================= THREE.JS 3D SCENE & COUNTDOWN LOGIC ================= -->
  <script>
    // Default configuration (persisted when exporting clean production file)
    let current3DMode = 'hourglass'; // 'hourglass' | 'clock'
    let copyVariantIndex = 0;
    const COPY_VARIANTS = [
      "We are upgrading and be live by 10 am on November 17.",
      "We are upgrading and will be live by 10:00 AM on November 17."
    ];

    // Three.js Globals
    let scene, camera, renderer;
    let rootGroup, hourglassGroup, clockGroup;
    let sandParticles, sandGeometry, sandPositions, sandVelocities;
    let topSandMesh, bottomSandMesh, sandStreamMesh;
    let clockSecondHand, clockMinuteHand, clockHourHand, gimbalRing1, gimbalRing2;

    // Interactive rotation & flip state
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let targetRot = { x: 0.14, y: 0.35 };
    let currentRot = { x: 0.14, y: 0.35 };
    let flipAngle = 0;
    let targetFlipAngle = 0;

    // Sand progress simulation (cycles smoothly so it never looks stuck)
    let sandProgress = 0.32; // 0.0 = all top, 1.0 = all bottom
    const SAND_COUNT = 260;

    function initThreeScene() {
      const container = document.getElementById('canvas-wrapper');
      const canvas = document.getElementById('three-canvas');

      scene = new THREE.Scene();

      const w = container.clientWidth || 500;
      const h = container.clientHeight || 350;
      camera = new THREE.PerspectiveCamera(36, w / h, 0.1, 100);
      camera.position.set(0, 0.2, 8.2);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lighting tailored to Fortifai v2.0 (#6699CC Brand Blue & #2E5A8A Deep Blue)
      const ambientLight = new THREE.AmbientLight(0x99AFBC, 0.75);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 1.35);
      keyLight.position.set(5, 8, 6);
      scene.add(keyLight);

      const brandRimLight = new THREE.PointLight(0x6699CC, 2.4, 18);
      brandRimLight.position.set(-4, 2, 4);
      scene.add(brandRimLight);

      const deepBottomLight = new THREE.PointLight(0x2E5A8A, 1.8, 15);
      deepBottomLight.position.set(3, -5, 3);
      scene.add(deepBottomLight);

      rootGroup = new THREE.Group();
      scene.add(rootGroup);

      build3DHourglass();
      build3DTickingClock();
      applyModeVisibility();

      setupInteractionEvents(container);
      window.addEventListener('resize', onWindowResize);

      animateScene();
    }

    // =========================================================================
    // 1. BUILD 3D FORENSIC SAND CLOCK (HOURGLASS)
    // =========================================================================
    function build3DHourglass() {
      hourglassGroup = new THREE.Group();
      rootGroup.add(hourglassGroup);

      // Materials
      const metalCapMat = new THREE.MeshStandardMaterial({
        color: 0x15263B,
        metalness: 0.82,
        roughness: 0.22
      });

      const accentRingMat = new THREE.MeshStandardMaterial({
        color: 0x6699CC,
        emissive: 0x2E5A8A,
        emissiveIntensity: 0.35,
        metalness: 0.75,
        roughness: 0.2
      });

      const pillarMat = new THREE.MeshStandardMaterial({
        color: 0x2E5A8A,
        metalness: 0.85,
        roughness: 0.25
      });

      const smokedGlassMat = new THREE.MeshPhysicalMaterial({
        color: 0x6699CC,
        transparent: true,
        opacity: 0.22,
        roughness: 0.1,
        metalness: 0.1,
        reflectivity: 0.9,
        side: THREE.DoubleSide
      });

      const glassWireMat = new THREE.MeshBasicMaterial({
        color: 0x6699CC,
        wireframe: true,
        transparent: true,
        opacity: 0.12
      });

      const glowingSandMat = new THREE.MeshStandardMaterial({
        color: 0x6699CC,
        emissive: 0x2E5A8A,
        emissiveIntensity: 0.55,
        roughness: 0.45,
        metalness: 0.15
      });

      // Top & Bottom Hexagonal/Cylindrical Architectural End Caps
      const capGeo = new THREE.CylinderGeometry(1.42, 1.42, 0.16, 36);
      const topCap = new THREE.Mesh(capGeo, metalCapMat);
      topCap.position.y = 1.85;
      hourglassGroup.add(topCap);

      const botCap = new THREE.Mesh(capGeo, metalCapMat);
      botCap.position.y = -1.85;
      hourglassGroup.add(botCap);

      // Glowing Brand-Blue Bezel Rings on Caps & Center Neck
      const bezelGeo = new THREE.TorusGeometry(1.42, 0.032, 16, 64);
      const topBezel = new THREE.Mesh(bezelGeo, accentRingMat);
      topBezel.rotation.x = Math.PI / 2;
      topBezel.position.y = 1.77;
      hourglassGroup.add(topBezel);

      const botBezel = new THREE.Mesh(bezelGeo, accentRingMat);
      botBezel.rotation.x = Math.PI / 2;
      botBezel.position.y = -1.77;
      hourglassGroup.add(botBezel);

      const neckCollarGeo = new THREE.TorusGeometry(0.22, 0.038, 16, 48);
      const neckCollar = new THREE.Mesh(neckCollarGeo, accentRingMat);
      neckCollar.rotation.x = Math.PI / 2;
      hourglassGroup.add(neckCollar);

      // 4 Precision Outer Strut Pillars
      const pillarGeo = new THREE.CylinderGeometry(0.045, 0.045, 3.65, 16);
      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2 + Math.PI / 4;
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(Math.cos(angle) * 1.22, 0, Math.sin(angle) * 1.22);
        hourglassGroup.add(pillar);
      }

      // Lathe Geometry for Curved Hourglass Glass Bulbs
      const bulbPoints = [];
      for (let i = 0; i <= 32; i++) {
        const t = i / 32; // 0 at neck, 1 at cap
        const y = t * 1.76;
        // Smooth forensic bell curve profile
        const r = 0.14 + 0.96 * Math.pow(Math.sin(t * Math.PI * 0.58), 1.35);
        bulbPoints.push(new THREE.Vector2(r, y));
      }

      const topBulbGeo = new THREE.LatheGeometry(bulbPoints, 48);
      const topBulbMesh = new THREE.Mesh(topBulbGeo, smokedGlassMat);
      const topBulbWire = new THREE.Mesh(topBulbGeo, glassWireMat);
      hourglassGroup.add(topBulbMesh);
      hourglassGroup.add(topBulbWire);

      const botBulbMesh = new THREE.Mesh(topBulbGeo, smokedGlassMat);
      botBulbMesh.rotation.z = Math.PI;
      const botBulbWire = new THREE.Mesh(topBulbGeo, glassWireMat);
      botBulbWire.rotation.z = Math.PI;
      hourglassGroup.add(botBulbMesh);
      hourglassGroup.add(botBulbWire);

      // Inner Top Sand Volume (Draining Cone/Cylinder)
      const topSandGeo = new THREE.CylinderGeometry(0.92, 0.12, 1.1, 36);
      topSandGeo.translate(0, 0.55, 0);
      topSandMesh = new THREE.Mesh(topSandGeo, glowingSandMat);
      topSandMesh.position.y = 0.08;
      hourglassGroup.add(topSandMesh);

      // Inner Bottom Sand Mound (Accumulating Cone)
      const botSandGeo = new THREE.ConeGeometry(0.98, 1.15, 36);
      botSandGeo.translate(0, 0.575, 0);
      bottomSandMesh = new THREE.Mesh(botSandGeo, glowingSandMat);
      bottomSandMesh.position.y = -1.76;
      hourglassGroup.add(bottomSandMesh);

      // Central Falling Data-Sand Stream Beam
      const streamGeo = new THREE.CylinderGeometry(0.028, 0.045, 1.72, 16);
      const streamMat = new THREE.MeshBasicMaterial({
        color: 0x93C5FD,
        transparent: true,
        opacity: 0.75
      });
      sandStreamMesh = new THREE.Mesh(streamGeo, streamMat);
      sandStreamMesh.position.y = -0.86;
      hourglassGroup.add(sandStreamMesh);

      // Glowing Falling Sand Particles inside Bottom Chamber
      sandGeometry = new THREE.BufferGeometry();
      sandPositions = new Float32Array(SAND_COUNT * 3);
      sandVelocities = new Float32Array(SAND_COUNT);

      for (let i = 0; i < SAND_COUNT; i++) {
        resetSandParticle(i, true);
      }
      sandGeometry.setAttribute('position', new THREE.BufferAttribute(sandPositions, 3));

      const particleMat = new THREE.PointsMaterial({
        color: 0x93C5FD,
        size: 0.055,
        transparent: true,
        opacity: 0.88
      });

      sandParticles = new THREE.Points(sandGeometry, particleMat);
      hourglassGroup.add(sandParticles);
    }

    function resetSandParticle(i, randomY = false) {
      const idx = i * 3;
      const spread = 0.035;
      sandPositions[idx] = (Math.random() - 0.5) * spread;
      sandPositions[idx + 1] = randomY ? -Math.random() * 1.55 : 0.02;
      sandPositions[idx + 2] = (Math.random() - 0.5) * spread;
      sandVelocities[i] = 0.018 + Math.random() * 0.022;
    }

    // =========================================================================
    // 2. BUILD 3D PRECISION TICKING CLOCK (CHRONOMETER)
    // =========================================================================
    function build3DTickingClock() {
      clockGroup = new THREE.Group();
      rootGroup.add(clockGroup);

      const darkBodyMat = new THREE.MeshStandardMaterial({
        color: 0x0D1520,
        metalness: 0.75,
        roughness: 0.3
      });

      const ringBlueMat = new THREE.MeshStandardMaterial({
        color: 0x2E5A8A,
        metalness: 0.85,
        roughness: 0.2
      });

      const brandGlowMat = new THREE.MeshStandardMaterial({
        color: 0x6699CC,
        emissive: 0x2E5A8A,
        emissiveIntensity: 0.45,
        metalness: 0.6,
        roughness: 0.2
      });

      const handWhiteMat = new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        emissive: 0x6699CC,
        emissiveIntensity: 0.25,
        metalness: 0.4,
        roughness: 0.2
      });

      // Outer Gimbal Ring 1 (Gyroscopic 3D ring)
      gimbalRing1 = new THREE.Mesh(new THREE.TorusGeometry(1.92, 0.045, 20, 80), ringBlueMat);
      clockGroup.add(gimbalRing1);

      // Outer Gimbal Ring 2
      gimbalRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.68, 0.032, 16, 80), brandGlowMat);
      clockGroup.add(gimbalRing2);

      // Main Watch/Chronometer Bezel & Dial Plate
      const dialPlate = new THREE.Mesh(new THREE.CylinderGeometry(1.48, 1.48, 0.14, 64), darkBodyMat);
      dialPlate.rotation.x = Math.PI / 2;
      clockGroup.add(dialPlate);

      const innerRim = new THREE.Mesh(new THREE.TorusGeometry(1.48, 0.055, 20, 64), ringBlueMat);
      clockGroup.add(innerRim);

      // 60 Precision Tick Marks around the 3D Dial
      for (let i = 0; i < 60; i++) {
        const isMajor = i % 5 === 0;
        const tickGeo = new THREE.BoxGeometry(isMajor ? 0.045 : 0.02, isMajor ? 0.18 : 0.08, 0.04);
        const tickMesh = new THREE.Mesh(tickGeo, isMajor ? brandGlowMat : ringBlueMat);
        const angle = (i / 60) * Math.PI * 2;
        const radius = isMajor ? 1.25 : 1.3;
        tickMesh.position.set(Math.sin(angle) * radius, Math.cos(angle) * radius, 0.08);
        tickMesh.rotation.z = -angle;
        clockGroup.add(tickMesh);
      }

      // Hour Hand
      clockHourHand = new THREE.Group();
      const hMesh = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.68, 0.04), handWhiteMat);
      hMesh.position.y = 0.28;
      clockHourHand.position.z = 0.11;
      clockHourHand.add(hMesh);
      clockGroup.add(clockHourHand);

      // Minute Hand
      clockMinuteHand = new THREE.Group();
      const mMesh = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.98, 0.04), handWhiteMat);
      mMesh.position.y = 0.42;
      clockMinuteHand.position.z = 0.13;
      clockMinuteHand.add(mMesh);
      clockGroup.add(clockMinuteHand);

      // Ticking Second Hand (Brand Blue)
      clockSecondHand = new THREE.Group();
      const sMesh = new THREE.Mesh(new THREE.BoxGeometry(0.026, 1.26, 0.03), brandGlowMat);
      sMesh.position.y = 0.45;
      clockSecondHand.position.z = 0.16;
      clockSecondHand.add(sMesh);
      clockGroup.add(clockSecondHand);

      // Center Cap Pin
      const centerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.12, 24), brandGlowMat);
      centerCap.rotation.x = Math.PI / 2;
      centerCap.position.z = 0.16;
      clockGroup.add(centerCap);
    }

    // =========================================================================
    // 3. ANIMATION LOOP (60FPS)
    // =========================================================================
    function animateScene() {
      requestAnimationFrame(animateScene);

      const now = performance.now() * 0.001;

      // Gentle autonomous idle rotation when not dragging
      if (!isDragging) {
        targetRot.y += 0.0035;
      }

      // Smooth spring interpolation for mouse drag & flip
      currentRot.x += (targetRot.x - currentRot.x) * 0.08;
      currentRot.y += (targetRot.y - currentRot.y) * 0.08;
      flipAngle += (targetFlipAngle - flipAngle) * 0.07;

      rootGroup.rotation.x = currentRot.x;
      rootGroup.rotation.y = currentRot.y;
      rootGroup.rotation.z = flipAngle;
      rootGroup.position.y = Math.sin(now * 1.6) * 0.06;

      if (current3DMode === 'hourglass') {
        // Slowly advance sand progress and cycle cleanly
        sandProgress += 0.00055;
        if (sandProgress >= 0.92) {
          sandProgress = 0.12;
          targetFlipAngle += Math.PI;
        }

        // Scale top & bottom sand volumes proportionally
        const topScale = Math.max(0.08, 1 - sandProgress);
        topSandMesh.scale.set(Math.pow(topScale, 0.45), topScale, Math.pow(topScale, 0.45));

        const botScale = Math.max(0.12, sandProgress);
        bottomSandMesh.scale.set(Math.pow(botScale, 0.5), botScale, Math.pow(botScale, 0.5));

        // Update falling particles
        const posArr = sandGeometry.attributes.position.array;
        const moundTopY = -1.76 + (botScale * 1.05);

        for (let i = 0; i < SAND_COUNT; i++) {
          const idx = i * 3;
          posArr[idx + 1] -= sandVelocities[i];
          // Slight radial scatter near bottom mound
          if (posArr[idx + 1] < -0.7) {
            posArr[idx] *= 1.03;
            posArr[idx + 2] *= 1.03;
          }
          if (posArr[idx + 1] <= moundTopY) {
            resetSandParticle(i, false);
          }
        }
        sandGeometry.attributes.position.needsUpdate = true;
      } else {
        // 3D Precision Ticking Clock Mode
        const d = new Date();
        const ms = d.getMilliseconds();
        const sec = d.getSeconds() + Math.pow(ms / 1000, 4); // Crisp mechanical tick snap
        const min = d.getMinutes() + sec / 60;
        const hr = (d.getHours() % 12) + min / 60;

        clockSecondHand.rotation.z = -(sec / 60) * Math.PI * 2;
        clockMinuteHand.rotation.z = -(min / 60) * Math.PI * 2;
        clockHourHand.rotation.z = -(hr / 12) * Math.PI * 2;

        // Subtle gimbal ring counter-rotation
        gimbalRing1.rotation.x = Math.sin(now * 0.7) * 0.28;
        gimbalRing1.rotation.y = Math.cos(now * 0.5) * 0.28;
        gimbalRing2.rotation.x = -Math.cos(now * 0.8) * 0.22;
        gimbalRing2.rotation.y = Math.sin(now * 0.6) * 0.22;
      }

      renderer.render(scene, camera);
    }

    // =========================================================================
    // 4. INTERACTIVITY, MODE SWITCHING & LIVE COUNTDOWN
    // =========================================================================
    function setupInteractionEvents(el) {
      el.addEventListener('mousedown', (e) => {
        isDragging = true;
        prevMouse = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        targetRot.y += dx * 0.008;
        targetRot.x = Math.max(-0.65, Math.min(0.65, targetRot.x + dy * 0.008));
        prevMouse = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      // Touch support for mobile/tablet
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - prevMouse.x;
        const dy = e.touches[0].clientY - prevMouse.y;
        targetRot.y += dx * 0.008;
        targetRot.x = Math.max(-0.65, Math.min(0.65, targetRot.x + dy * 0.008));
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });

      window.addEventListener('touchend', () => { isDragging = false; });

      el.addEventListener('dblclick', triggerHourglassFlip);
    }

    function triggerHourglassFlip() {
      targetFlipAngle += Math.PI;
      if (current3DMode === 'hourglass') {
        sandProgress = 0.14;
      }
    }

    function set3DMode(mode) {
      current3DMode = mode;
      targetFlipAngle = 0;
      flipAngle = 0;
      applyModeVisibility();

      const btnH = document.getElementById('btn-mode-hourglass');
      const btnC = document.getElementById('btn-mode-clock');
      const actionLbl = document.getElementById('action-btn-label');

      if (btnH && btnC) {
        btnH.classList.toggle('active', mode === 'hourglass');
        btnC.classList.toggle('active', mode === 'clock');
      }
      if (actionLbl) {
        actionLbl.textContent = mode === 'hourglass' ? 'Flip Sand Clock' : 'Pulse Chronometer';
      }
    }

    function applyModeVisibility() {
      if (!hourglassGroup || !clockGroup) return;
      hourglassGroup.visible = (current3DMode === 'hourglass');
      clockGroup.visible = (current3DMode === 'clock');
    }

    function toggleHeadlineCopy() {
      copyVariantIndex = (copyVariantIndex + 1) % COPY_VARIANTS.length;
      document.getElementById('headline-text').textContent = COPY_VARIANTS[copyVariantIndex];
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-wrapper');
      if (!container || !renderer || !camera) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // Live Countdown to November 17 at 10:00:00 AM
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 10, 17, 10, 0, 0); // Month 10 = November

      // If November 17 10:00 AM has already passed in the current year, clamp at 00
      const diff = Math.max(0, target.getTime() - now.getTime());

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
      document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }

    // One-Click Export Clean HTML for GitHub / Vercel Deployment
    function exportCleanHTML() {
      const clone = document.documentElement.cloneNode(true);

      // Remove the Three.js runtime canvas children & studio toolbar from exported snapshot
      const studioBar = clone.querySelector('#studio-controls');
      if (studioBar) studioBar.remove();

      let htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
      // Bake the currently chosen 3D mode and copy variant into the exported file
      htmlContent = htmlContent.replace(
        "let current3DMode = 'hourglass';",
        `let current3DMode = '${current3DMode}';`
      );
      htmlContent = htmlContent.replace(
        "let copyVariantIndex = 0;",
        `let copyVariantIndex = ${copyVariantIndex};`
      );

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.onload = function () {
      initThreeScene();
      updateCountdown();
      setInterval(updateCountdown, 1000);
    };
  </script>

</body></html>
